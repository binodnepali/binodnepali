name: Sync profile README

on:
  push:
    branches: [main]
    paths:
      - data/linkedin-profile.json
      - src/server/profile/readmeMarkdown.ts
      - scripts/generate-profile-readme.ts
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Generate README.md
        run: deno task generate-profile-readme

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "README.md is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: sync profile README from profile data"
          git push
